<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lootdle</title>
    <link rel="icon" type="image/png" href="assets/images/lootdle-logo.png">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/crt.css">
    <link rel="stylesheet" href="assets/css/shop-items.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
    </style>
</head>
<body>
    <div id="shop-items-container">
        <a href="assets/html/minecraft-wordle.html" class="shop-item" data-title="Crafting Table" data-description="Minecraft Wordle">
            <img src="assets/shop-items-static/Item_CraftingTable.png" alt="Shop Item 1">
        </a>
        <a href="assets/html/the-binding-of-isaac-wordle.html" class="shop-item" data-title="Guppy's Head" data-description="The Binding of Isaac Wordle">
            <img src="assets/shop-items-static/Item_Guppy.png" alt="Shop Item 2">
        </a>
        <a href="assets/html/stardew-valley-wordle.html" class="shop-item" data-title="Junimo" data-description="Stardew Valley Wordle">
            <img src="assets/shop-items-static/Item_Junimo.png" alt="Shop Item 3">
        </a>
        <a href="assets/html/pokemon-wordle.html" class="shop-item" data-title="Pokéball" data-description="Pokémon Wordle">
            <img src="assets/shop-items-static/Item_Pokeball.png" alt="Shop Item 4">
        </a>
        <a href="assets/html/league-of-legends-wordle.html" class="shop-item" data-title="Poro" data-description="League of Legends Wordle">
            <img src="assets/shop-items-static/Item_Poro.png" alt="Shop Item 5">
        </a>
        <a href="assets/html/enter-the-gungeon-wordle.html" class="shop-item" data-title="Ser Junkan" data-description="Enter the Gungeon Wordle">
            <img src="assets/shop-items-static/Item_SerJunkan.png" alt="Shop Item 6">
        </a>
        <a href="assets/html/terraria-wordle.html" class="shop-item" data-title="Slime" data-description="Terraria Wordle">
            <img src="assets/shop-items-static/Item_Slime.png" alt="Shop Item 7">
        </a>
        <a href="assets/html/risk-of-rain-wordle.html" class="shop-item" data-title="Tougher Times" data-description="Risk of Rain Wordle">
            <img src="assets/shop-items-static/Item_TougherTimes.png" alt="Shop Item 8">
        </a>
    </div>
    <div id="crt-overlay"></div>
    <div id="button-container">
        <div class="button-label">
            <span>CRT</span>
            <button id="toggle-background" title="Switch Background"></button>
        </div>
        <div class="button-label">
            <span>TIME</span>
            <button id="toggle-crt" title="Toggle CRT Filter"></button>
        </div>
    </div>
    
    <script src="assets/js/shop-items.js"></script>
    <script>
        const crtButton = document.getElementById('toggle-crt');
        const button = document.getElementById('toggle-background');
        const body = document.body;
        const crtOverlay = document.getElementById('crt-overlay');

        button.addEventListener('click', () => 
        {
            if (body.style.backgroundImage.includes('Day_Mode.gif')) 
            {
                body.style.backgroundImage = "url('assets/backgrounds/Night_Mode.gif')";
            } 
            else 
            {
                body.style.backgroundImage = "url('assets/backgrounds/Day_Mode.gif')";
            }
        });

        crtButton.addEventListener('click', () => 
        {
            crtOverlay.style.display = crtOverlay.style.display === 'none' ? 'block' : 'none';
        });
    </script>
    <script src="assets/js/shop-items.js"></script>
</body>
</html>
